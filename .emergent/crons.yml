crons:
  - name: lift-suspensions
    description: "Auto-lifts expired user suspensions every 15 minutes"
    cron: "*/15 * * * *"
    endpoint: "{{BASE_URL}}/api/cron/lift-suspensions"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: hourly-backup
    description: "Snapshots all MongoDB collections to /app/backups every hour (keeps last 24)"
    cron: "0 * * * *"
    endpoint: "{{BASE_URL}}/api/cron/backup"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: daily-cleanup
    description: "Daily disk cleanup: prunes expired reset tokens, old cron runs, old notifications, 30d+ soft-deletes"
    cron: "15 3 * * *"
    endpoint: "{{BASE_URL}}/api/cron/cleanup"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: false
  - name: tmdb-cast-backfill
    description: "Cineverse BOT audits movie cast and TV metadata against TMDB every five minutes"
    cron: "*/5 * * * *"
    endpoint: "{{BASE_URL}}/api/cron/tmdb-cast-backfill"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
